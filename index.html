<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPG 公共郵箱 — Ida Sze</title>
<style>
  body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif; margin: 0; background: #f5f5f4; color: #222; }
  header { background: #1f3a5f; color: #fff; padding: 14px 18px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  #gate, #app { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #1f3a5f; color: #fff; cursor: pointer; margin-top: 10px; }
  button.secondary { background: #e5e5e5; color: #222; }
  .err { color: #b00020; margin-top: 10px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 12px; }
  #list { list-style: none; padding: 0; margin: 0; }
  #list li { border-top: 1px solid #eee; padding: 12px 4px; cursor: pointer; }
  #list li:hover { background: #f7f9fc; }
  #list .subj { font-weight: 600; }
  #list .from { color: #444; font-size: 14px; }
  #list .date { color: #888; font-size: 12px; }
  #detail { white-space: pre-wrap; word-break: break-word; background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-top: 12px; font-size: 14px; line-height: 1.6; }
  #replyBox { margin-top: 16px; border-top: 1px solid #eee; padding-top: 12px; }
  #replyBox textarea { width: 100%; box-sizing: border-box; min-height: 140px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  #replyBox input[type=text] { margin-bottom: 8px; }
  #replyBox label { display: block; font-size: 13px; color: #666; margin: 8px 0 4px; }
  #replyStatus { margin-top: 10px; font-size: 14px; }
  #replyStatus.ok { color: #0a7a2f; }
  #replyStatus.err { color: #b00020; }
  .tag { display: inline-block; font-size: 11px; color: #1f3a5f; background: #e8eef5; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>UPG 公共郵箱</h1>
  <p>Ida.Sze@upg.com.hk（收信 + 回覆）</p>
</header>
<main>
  <div id="gate">
    <p>請輸入閱覽密碼。</p>
    <input id="pw" type="password" placeholder="閱覽密碼" autocomplete="off">
    <br><button id="unlock">開信箱</button>
    <p class="err hidden" id="gateErr"></p>
    <p class="meta">密碼只會喺你部機上面用嚟解密；回覆嗰陣會傳去 Cloudflare Worker 驗證身份，唔會存起。</p>
  </div>

  <div id="app" class="hidden">
    <p class="meta" id="syncInfo"></p>
    <input id="q" type="text" placeholder="搜尋寄件人 / 主旨…">
    <ul id="list"></ul>
    <div id="detailWrap" class="hidden">
      <button class="secondary" id="back">← 返回列表</button>
      <h3 id="dSubj"></h3>
      <p class="meta" id="dMeta"></p>
      <div id="detail"></div>
      <div id="replyBox">
        <h4>回覆（以 Ida.Sze@upg.com.hk 寄出）</h4>
        <label>收件人</label>
        <input id="rTo" type="text" readonly>
        <label>主旨</label>
        <input id="rSubj" type="text">
        <label>回覆內容</label>
        <textarea id="rBody" placeholder="打回覆內容…"></textarea>
        <br><button id="sendReply">寄出回覆</button>
        <p id="replyStatus"></p>
      </div>
    </div>
    <button class="secondary" id="refresh">重新整理</button>
  </div>
</main>
<script>
const REPLY_API = "https://upg-mail-relay-send.yan-lam.workers.dev/send";
let MESSAGES = [];
let KEY = null;
let PW = null;
let CURRENT = null;

function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("zh-HK", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("gateErr");
  err.classList.add("hidden");
  if (!pw) { err.textContent = "請輸入密碼。"; err.classList.remove("hidden"); return; }
  try {
    const res = await fetch("mail.enc.json", { cache: "no-store" });
    if (!res.ok) throw new Error("未有信件資料（mail.enc.json 唔存在），請稍後再試。");
    const enc = await res.json();
    const salt = b64ToBuf(enc.salt), nonce = b64ToBuf(enc.nonce), data = b64ToBuf(enc.data);
    const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    KEY = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, KEY, data);
    const payload = JSON.parse(new TextDecoder().decode(plain));
    MESSAGES = payload.messages || [];
    PW = pw;
    document.getElementById("syncInfo").textContent =
      "共 " + payload.count + " 封（最新 " + MESSAGES.length + " 封）・最後同步：" + fmtDate(payload.synced_at);
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    renderList("");
  } catch (e) {
    err.textContent = (e && e.name === "OperationError") ? "密碼唔啱，請再試。" : ("開唔到：" + (e.message || e));
    err.classList.remove("hidden");
  }
}
function renderList(q) {
  const needle = (q || "").toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("detailWrap").classList.add("hidden");
  const shown = MESSAGES.filter(m =>
    !needle || (m.subject + " " + m.from).toLowerCase().includes(needle));
  if (!shown.length) { list.innerHTML = "<li>搵唔到符合嘅信。</li>"; return; }
  shown.forEach(m => {
    const li = document.createElement("li");
    const subj = document.createElement("div"); subj.className = "subj"; subj.textContent = m.subject || "(冇主旨)";
    if (m.folder && m.folder !== "INBOX") {
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "寄件";
      subj.appendChild(tag);
    }
    const from = document.createElement("div"); from.className = "from"; from.textContent = m.from || "";
    const date = document.createElement("div"); date.className = "date"; date.textContent = fmtDate(m.date);
    li.append(subj, from, date);
    li.onclick = () => {
      CURRENT = m;
      document.getElementById("dSubj").textContent = m.subject || "(冇主旨)";
      document.getElementById("dMeta").textContent = "寄件人：" + (m.from || "") + "　時間：" + fmtDate(m.date) +
        (m.attachments && m.attachments.length ? "　附件：" + m.attachments.join("、") : "");
      document.getElementById("detail").textContent = m.body || "(冇內文)";
      const isSent = m.folder && m.folder !== "INBOX";
      document.getElementById("replyBox").classList.toggle("hidden", !!isSent);
      if (!isSent) {
        document.getElementById("rTo").value = extractEmail(m.from);
        document.getElementById("rSubj").value = /^re:/i.test(m.subject || "") ? m.subject : "Re: " + (m.subject || "");
        document.getElementById("rBody").value = "";
        document.getElementById("replyStatus").textContent = "";
        document.getElementById("replyStatus").className = "";
      }
      document.getElementById("detailWrap").classList.remove("hidden");
      document.getElementById("detailWrap").scrollIntoView();
    };
    list.appendChild(li);
  });
}
function extractEmail(from) {
  if (!from) return "";
  const m = from.match(/<([^<>]+)>/);
  if (m) return m[1].trim();
  const bare = from.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
  return bare ? bare[0] : from.trim();
}
async function sendReply() {
  const status = document.getElementById("replyStatus");
  const btn = document.getElementById("sendReply");
  status.textContent = "";
  status.className = "";
  if (!CURRENT || !PW) { status.textContent = "請重新整理再入密碼。"; status.className = "err"; return; }
  const to = document.getElementById("rTo").value.trim();
  const subject = document.getElementById("rSubj").value.trim();
  const text = document.getElementById("rBody").value.trim();
  if (!to || !subject || !text) { status.textContent = "收件人、主旨同內容唔可以留空。"; status.className = "err"; return; }
  const quoted = (CURRENT.body || "").split("\n").map(l => "> " + l).join("\n");
  const body = text + "\n\n--- 原文 ---\n" + quoted;
  const references = [CURRENT.references, CURRENT.message_id].filter(Boolean).join(" ").trim();
  btn.disabled = true;
  status.textContent = "寄緊…";
  try {
    const res = await fetch(REPLY_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ viewKey: PW, to, subject, body,
        inReplyTo: CURRENT.message_id || "", references }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      status.textContent = "已寄出。";
      status.className = "ok";
      document.getElementById("rBody").value = "";
    } else if (data.error === "bad_view_key") {
      status.textContent = "密碼唔啱，請重新整理再入密碼。";
      status.className = "err";
    } else {
      status.textContent = "寄唔出：" + (data.detail || data.error || res.status);
      status.className = "err";
    }
  } catch (e) {
    status.textContent = "寄唔出：網絡問題，請再試。";
    status.className = "err";
  }
  btn.disabled = false;
}
document.getElementById("sendReply").onclick = sendReply;
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
document.getElementById("q").addEventListener("input", e => renderList(e.target.value));
document.getElementById("back").onclick = () => document.getElementById("detailWrap").classList.add("hidden");
document.getElementById("refresh").onclick = () => location.reload();
</script>
</body>
</html>
